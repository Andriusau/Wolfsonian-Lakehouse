server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;

    # Blocked Bad Actors & Rogue Web Spiders
    deny 220.181.108.0/24;  # Baiduspider / Baidu crawl network
    deny 116.179.32.0/20;   # China Unicom automated scraping network

    # Keep-Alive Tuning for Reverse Proxy Stability
    keepalive_timeout 120s;
    keepalive_requests 10000;
    client_max_body_size 50M;

    location / {
        index  index.html index.htm;
    }
}
